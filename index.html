<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan 1 min</title>
<style>
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#18263a; --mute:#66758a; --line:#d9dfe6;
  --buy:#0c8f7d; --buy-bg:#dcf3ef; --sell:#c93d36; --sell-bg:#fbe3e1; --wait:#8a6d1c; --wait-bg:#f4ecd3;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121a26; --panel:#1a2536; --ink:#e7edf5; --mute:#8d9cb2; --line:#2b3a50;
  --buy:#3fd1b9; --buy-bg:#123b36; --sell:#ff7a72; --sell-bg:#471f1f; --wait:#e3c25f; --wait-bg:#3d3418;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 48px}
.wrap{max-width:860px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:28px;margin:0;letter-spacing:-.02em}
.status{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width 1s linear}
.row{display:grid;grid-template-columns:110px 1fr 120px;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;border-left-width:6px}
.row.buy{border-left-color:var(--buy)} .row.sell{border-left-color:var(--sell)} .row.wait{border-left-color:var(--line)}
.pair b{display:block;font-size:18px}
.pair span{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.meta{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
.meta em{font-style:normal;color:var(--ink)}
.sig{justify-self:end;text-align:center;min-width:110px;padding:8px 10px;border-radius:8px;font-weight:700;font-size:17px}
.sig small{display:block;font-weight:500;font-size:12px;opacity:.85}
.buy .sig{background:var(--buy-bg);color:var(--buy)} .sell .sig{background:var(--sell-bg);color:var(--sell)} .wait .sig{background:var(--wait-bg);color:var(--wait)}
h2{font-size:18px;margin:28px 0 10px}
.log{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 16px;font-size:14px;font-variant-numeric:tabular-nums}
.log div{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.log div:last-child{border-bottom:0}
.log .b{color:var(--buy);font-weight:600} .log .s{color:var(--sell);font-weight:600}
.empty{color:var(--mute);padding:10px 0}
.note{color:var(--mute);font-size:13px;margin-top:22px}
.err{color:var(--sell);font-size:14px;margin-bottom:10px}
button{font:inherit;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button:focus-visible{outline:3px solid var(--buy);outline-offset:2px}
@media (max-width:560px){.row{grid-template-columns:1fr auto}.meta{grid-column:1/-1}.sig{grid-row:1;grid-column:2}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Scan 1 minute</h1>
      <div class="status" id="status">Chargement…</div>
    </div>
    <button id="refresh">Scanner maintenant</button>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="err" id="err" hidden></div>
  <div id="rows"></div>
  <h2>Historique des signaux</h2>
  <div class="log" id="log"><div class="empty">Aucun signal pour l’instant.</div></div>
  <p class="note">Bougies 1 min Binance. Signal = score de 4 indicateurs (EMA 9/21, RSI 14, MACD, Bandes de Bollinger). Le scan tourne tant que cette page reste ouverte. Ce sont des indicateurs techniques, pas une garantie de résultat.</p>
</div>

<script>
const PAIRS = ["BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT","XRPUSDT","DOGEUSDT","ADAUSDT","EURUSDT"];
const SCAN_EVERY = 60; // secondes
const API = "https://api.binance.com/api/v3/klines?interval=1m&limit=120&symbol=";
let countdown = SCAN_EVERY, scanning = false, lastSig = {}, history = [];

const ema = (a,p)=>{const k=2/(p+1),r=[a[0]];for(let i=1;i<a.length;i++)r.push(a[i]*k+r[i-1]*(1-k));return r};
function rsi(c,p=14){
  let g=0,l=0;
  for(let i=1;i<=p;i++){const d=c[i]-c[i-1];d>=0?g+=d:l-=d}
  g/=p;l/=p;
  for(let i=p+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(p-1)+Math.max(d,0))/p;l=(l*(p-1)+Math.max(-d,0))/p}
  return l===0?100:100-100/(1+g/l);
}
function analyse(c){
  const last=c[c.length-1];
  const e9=ema(c,9),e21=ema(c,21);
  const m12=ema(c,12),m26=ema(c,26),macd=m12.map((v,i)=>v-m26[i]),sg=ema(macd,9);
  const h=macd.map((v,i)=>v-sg[i]), h0=h[h.length-1], h1=h[h.length-2];
  const w=c.slice(-20),mean=w.reduce((a,b)=>a+b,0)/20,sd=Math.sqrt(w.reduce((a,b)=>a+(b-mean)**2,0)/20);
  const up=mean+2*sd,lo=mean-2*sd;
  const r=rsi(c);
  let score=0;
  score+= e9[e9.length-1]>e21[e21.length-1]?1:-1;
  score+= r<30?1:r>70?-1:0;
  score+= (h0>0&&h0>h1)?1:(h0<0&&h0<h1)?-1:0;
  score+= last<lo?1:last>up?-1:0;
  return {last,score,rsi:r,hist:h0,trend:e9[e9.length-1]>e21[e21.length-1]?"haussier":"baissier"};
}
const label=s=>s>=3?["ACHAT","fort"]:s>=2?["ACHAT","modéré"]:s<=-3?["VENTE","fort"]:s<=-2?["VENTE","modéré"]:["ATTENTE","pas de signal"];
const fmt=n=>n>=100?n.toFixed(2):n>=1?n.toFixed(4):n.toFixed(6);
const nm=p=>p.replace("USDT","/USDT");

async function scanOne(sym){
  const res=await fetch(API+sym);
  if(!res.ok) throw new Error(sym+" "+res.status);
  const k=await res.json();
  return {sym,...analyse(k.slice(0,-1).concat([k[k.length-1]]).map(x=>+x[4]))};
}
async function scan(){
  if(scanning) return; scanning=true;
  document.getElementById("status").textContent="Scan en cours…";
  const out=await Promise.allSettled(PAIRS.map(scanOne));
  const ok=out.filter(o=>o.status==="fulfilled").map(o=>o.value);
  const bad=out.filter(o=>o.status==="rejected").length;
  const err=document.getElementById("err");
  err.hidden=!bad; err.textContent=bad?bad+" paire(s) non chargée(s). Vérifie ta connexion ou réessaie.":"";
  const now=new Date().toLocaleTimeString("fr-FR");
  let active=0;
  document.getElementById("rows").innerHTML=ok.map(o=>{
    const [t,sub]=label(o.score),cls=o.score>=2?"buy":o.score<=-2?"sell":"wait";
    if(cls!=="wait") active++;
    if(cls!=="wait"&&lastSig[o.sym]!==t){history.unshift({time:now,sym:o.sym,t,sub,price:o.last});}
    lastSig[o.sym]=cls==="wait"?null:t;
    return `<div class="row ${cls}">
      <div class="pair"><b>${nm(o.sym)}</b><span>${fmt(o.last)}</span></div>
      <div class="meta"><span>Tendance <em>${o.trend}</em></span><span>RSI <em>${o.rsi.toFixed(1)}</em></span><span>MACD <em>${o.hist>0?"+":"−"}</em></span><span>Score <em>${o.score>0?"+":""}${o.score}/4</em></span></div>
      <div class="sig">${t}<small>${sub}</small></div></div>`;
  }).join("");
  history=history.slice(0,30);
  document.getElementById("log").innerHTML=history.length?history.map(h=>`<div><span>${h.time} · ${nm(h.sym)} @ ${fmt(h.price)}</span><span class="${h.t==="ACHAT"?"b":"s"}">${h.t} (${h.sub})</span></div>`).join(""):'<div class="empty">Aucun signal pour l’instant.</div>';
  document.title=(active?"("+active+") ":"")+"Scan 1 min";
  document.getElementById("status").textContent="Dernier scan à "+now+" — "+active+" signal(s) actif(s)";
  countdown=SCAN_EVERY; scanning=false;
}
setInterval(()=>{
  countdown=Math.max(0,countdown-1);
  document.getElementById("prog").style.width=((SCAN_EVERY-countdown)/SCAN_EVERY*100)+"%";
  if(countdown===0) scan();
},1000);
document.getElementById("refresh").onclick=scan;
scan();
</script>
</body>
</html>
